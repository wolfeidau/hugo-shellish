{{- $related := .Site.RegularPages.Related . | first 3 -}}
{{- if $related }}
<aside class="related-posts">
    <h2># related</h2>
    <ul>
        {{- range $related }}
        <li>
            <a href="{{ .Permalink }}">- {{ .Title }} →</a>
        </li>
        {{- end }}
    </ul>
</aside>
{{- end }}
