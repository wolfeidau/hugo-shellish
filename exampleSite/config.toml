baseURL = "http://localhost:1313"
languageCode = "en-us"
title = "Shellish Site"
theme = "hugo-shellish"

[outputs]
  home = ["HTML", "RSS", "llms"]
  page = ["HTML", "md"]

[outputFormats.llms]
  name = "llms"
  mediaType = "text/plain"
  baseName = "llms"

[outputFormats.md]
  name = "md"
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true



[pagination]
  pagerSize = 10
  path = "page"

[params]
  # Site metadata
  author = "Your Name"
  description = "A minimal shell-inspired website"
  favicon = "/favicon.ico"
  
  # Color theme
  backgroundColor = "#0d1117"
  textColor = "#c9d1d9"
  accentColor = "#58a6ff"
  
  # Navigation
  showBreadcrumbs = true
  showNotes = false
  
  # Social links
  [params.social]
    github = ""
    twitter = ""
    linkedin = ""
    rss = true

[menu]
  [[menu.main]]
    name = "home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "blog"
    url = "/blog"
    weight = 2
  [[menu.main]]
    name = "notes"
    url = "/notes"
    weight = 3
  [[menu.main]]
    name = "projects"
    url = "/projects"
    weight = 4

[markup.highlight]
  lineNos = false
  # using assets/css/syntax.css in the theme to support light/dark mode
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true
  autoHeadingID = true

[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "keywords"
    weight = 80

  [[related.indices]]
    name = "date"
    weight = 10
